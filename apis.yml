aid: canary-technologies
name: Canary Technologies
description: >-
  Canary Technologies is an AI-powered hospitality management platform trusted by
  more than 20,000 hotels across 90+ countries, including brands such as Marriott
  International, Four Seasons, Choice Hotels, Wyndham, and IHG. Founded in 2016 and
  headquartered in San Francisco, Canary provides digital guest management —
  contactless mobile check-in/checkout, tablet registration, upsells, guest
  messaging, digital tipping, and Canary AI — along with PCI-compliant secure
  transactions and fraud prevention. The company maintains its own integration
  tooling and a partner/enterprise API that connects to 80+ property-management,
  payment, and hospitality systems (Oracle Hospitality, Mews, Cloudbeds, Sabre,
  Adyen, Shift4, and others), launching 5-10 new integrations per quarter. Canary
  does not publish a public developer portal or OpenAPI; API access is granted to
  hotel partners and integration providers.
